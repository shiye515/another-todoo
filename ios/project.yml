name: TodooCardIOS
options:
  bundleIdPrefix: com.todoo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: TodooCardIOS
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  TodooCardIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Views
      - path: Assets.xcassets
      # 与 macOS 应用共享同一套模型与服务源码（单一真源）
      - path: ../macos/Models
      - path: ../macos/Services
    scheme:
      testTargets:
        - TodooCardIOSTests
        - TodooCardIOSUITests
      gatherCoverageData: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.todoo.TodooCardIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TodooCard
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 需要蓝牙以扫描附近的 TodooCard 并发送图片到电子墨水屏卡片
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 与 macOS 应用共用模块名，使 ../macos/Tests 下的同一套单元测试源码可直接复用
        PRODUCT_MODULE_NAME: TodooCardMacApp

  TodooCardIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../macos/Tests
        excludes:
          - HorizontalWheelScrollSupportTests.swift
    dependencies:
      - target: TodooCardIOS
    settings:
      base:
        PRODUCT_NAME: TodooCardIOSTests
        PRODUCT_MODULE_NAME: TodooCardIOSTests
        GENERATE_INFOPLIST_FILE: YES

  TodooCardIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TodooCardIOS
    settings:
      base:
        PRODUCT_NAME: TodooCardIOSUITests
        PRODUCT_MODULE_NAME: TodooCardIOSUITests
        GENERATE_INFOPLIST_FILE: YES
